<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        body {
            margin: 0;
            overflow: hidden;
        }

        video,
        canvas {
            position: absolute;
            top: 0;
            left: 0;
        }

        video {
            width: 100vw;
            height: 100vh;
            object-fit: cover;
        }

        canvas {
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>

<body>
    <video id="videoElement" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>

    <script type="module" src="./script.js"></script>
</body>

</html>
